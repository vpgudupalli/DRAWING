<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split Face, Alive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@400;700&display=swap">
<style>
  /* Layout: one framed paper stage, centered, with a small caption and two controls under it. Single committed look (construction paper on a dark table). */
  :root {
    --table: #1d1b1a;
    --paper-orange: #f2643a;
    --paper-black: #2a2a2e;
    --crayon-brown: #5b2414;
    --chalk: #e9e7e2;
    --ink: #f4ede6;
    --muted: #b9aea6;
    --display: "Gochi Hand", "Comic Sans MS", cursive;
    --body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--table);
    color: var(--ink);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 38px); margin: 0; text-wrap: balance; text-align: center; }
  .stage {
    width: min(100%, 560px, calc((100vh - 170px) * 0.78));
    aspect-ratio: 960 / 1230;
    max-width: 100%;
    box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05);
    transform: rotate(-0.6deg);
    cursor: pointer;
    border-radius: 3px;
    overflow: hidden;
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button {
    font: 700 14px/1 var(--body);
    color: var(--table); background: var(--paper-orange);
    border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--muted); }
  button:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; max-width: 46ch; margin: 0; }

  /* ---------- motion ---------- */
  .tb { transform-box: fill-box; transform-origin: center; }
  #sunRays { animation: spin 18s linear infinite; }
  #sun { animation: pulse 3s ease-in-out infinite; }
  .cloud { animation: drift var(--d, 9s) ease-in-out infinite alternate; }
  .star { animation: twinkle var(--d, 2.4s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
  .eye { animation: blink 5s infinite; }
  .eye.late { animation-delay: .06s; }
  #topHalf { animation: chatTop 4s ease-in-out infinite; }
  #bottomHalf { animation: chatBottom 4s ease-in-out infinite; }
  .zip rect, .zip path { animation: wiggle 1.6s ease-in-out infinite; animation-delay: var(--delay, 0s); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @keyframes drift { from { transform: translate(-18px, 4px); } to { transform: translate(18px, -6px); } }
  @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85) rotate(-6deg); } 50% { opacity: 1; transform: scale(1.12) rotate(6deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  @keyframes chatTop { 0%, 55%, 100% { transform: translateY(0); } 65% { transform: translateY(-10px); } 75% { transform: translateY(-2px); } 85% { transform: translateY(-8px); } }
  @keyframes chatBottom { 0%, 55%, 100% { transform: translateY(0); } 65% { transform: translateY(10px); } 75% { transform: translateY(2px); } 85% { transform: translateY(8px); } }
  @keyframes wiggle { 50% { transform: translateX(4px) rotate(2deg); } }

  /* big "surprise" when tapped */
  .wow #topHalf { animation: wowTop 1.2s ease-in-out; }
  .wow #bottomHalf { animation: wowBottom 1.2s ease-in-out; }
  .wow .star { animation: burst .9s ease-out; }
  @keyframes wowTop { 40% { transform: translateY(-46px) rotate(-3deg); } 70% { transform: translateY(-40px) rotate(2deg); } }
  @keyframes wowBottom { 40% { transform: translateY(46px) rotate(3deg); } 70% { transform: translateY(40px) rotate(-2deg); } }
  @keyframes burst { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.9) rotate(40deg); opacity: 1; } 100% { transform: scale(1); opacity: .6; } }

  .paused *, .paused { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
</style>
</head>
<body>
<h1>Split Face, Alive</h1>

<div class="stage" id="stage" role="img" aria-label="Animated version of a paper-collage drawing: a face split into a black top half and orange bottom half, with a stitched zigzag, a blinking eye, a spinning sun, drifting clouds and twinkling chalk stars.">
<svg viewBox="0 0 960 1230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- "boiling line" crayon wobble: the turbulence seed flips every few frames -->
    <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;2;3;4" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="paper" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n">
        <animate attributeName="seed" values="7;8;9" dur="0.75s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="0.75" stop-color="#3a3a40"/>
      <stop offset="1" stop-color="#55555c"/>
    </linearGradient>
  </defs>

  <!-- backgrounds -->
  <rect width="960" height="605" fill="#f2643a"/>
  <rect y="605" width="960" height="625" fill="url(#floor)"/>

  <!-- side crayon lines -->
  <path d="M150 0 C140 120 135 250 120 380 S100 560 98 605" fill="none" stroke="#5b2414" stroke-width="5" stroke-linecap="round" filter="url(#crayon)"/>
  <path d="M155 1030 C158 1100 160 1170 162 1230" fill="none" stroke="#e9e7e2" stroke-opacity=".55" stroke-width="4" filter="url(#crayon)"/>

  <!-- sun -->
  <g id="sun" class="tb">
    <g id="sunRays" class="tb" filter="url(#crayon)" stroke="#5b2414" stroke-width="5" stroke-linecap="round"></g>
    <circle cx="872" cy="80" r="52" fill="none" stroke="#5b2414" stroke-width="5" filter="url(#crayon)"/>
  </g>

  <!-- clouds (filled by script) -->
  <g id="clouds" filter="url(#crayon)"></g>

  <!-- TOP HALF OF FACE -->
  <g id="topHalf">
    <path d="M100 605 C92 420 112 240 190 150 Q300 92 560 108 Q700 125 790 250 Q835 380 822 605 Z" fill="#2a2a2e" filter="url(#paper)"/>
    <g fill="none" stroke="#c9c4bd" stroke-opacity=".75" stroke-width="5" stroke-linecap="round" filter="url(#crayon)">
      <path d="M175 298 Q420 255 640 280 Q760 290 800 330"/>
      <path d="M125 340 Q400 300 620 340 Q760 360 810 420"/>
      <path d="M105 470 Q260 430 360 405 Q560 420 730 470 Q790 490 805 530"/>
      <path d="M110 575 Q280 520 420 520 Q620 515 790 590"/>
    </g>
    <g class="zip" id="zipTop" fill="#f2643a"></g>
    <g class="eye tb">
      <circle cx="680" cy="437" r="40" fill="#f2643a" filter="url(#paper)"/>
      <path d="M652 438 L708 436" stroke="#c9472a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- nose pieces -->
    <g fill="#f2643a" filter="url(#paper)">
      <path d="M470 580 L505 552 L530 575 L512 600 L478 602 Z"/>
      <path d="M535 575 L560 560 L578 590 L545 602 Z"/>
    </g>
    <!-- ear notch at the fold -->
    <rect x="802" y="575" width="72" height="30" fill="#2a2a2e" filter="url(#paper)"/>
  </g>

  <!-- BOTTOM HALF OF FACE -->
  <g id="bottomHalf">
    <path d="M95 605 C95 720 110 900 170 1000 Q260 1105 425 1122 Q610 1125 725 1000 Q832 860 832 605 Z" fill="#f2643a" filter="url(#paper)"/>
    <g fill="none" stroke="#7a2a1a" stroke-opacity=".8" stroke-width="5" stroke-linecap="round" filter="url(#crayon)">
      <path d="M100 650 Q300 700 460 712 Q680 700 800 650"/>
      <path d="M105 745 Q300 780 470 800 Q640 795 820 690"/>
      <path d="M140 860 Q300 940 500 950 Q700 930 810 800"/>
      <path d="M170 960 Q380 1010 560 990 Q720 950 820 700"/>
    </g>
    <g class="zip" id="zipBottom" fill="#2a2a2e"></g>
    <g class="eye late tb">
      <circle cx="670" cy="748" r="40" fill="#2a2a2e" filter="url(#paper)"/>
      <path d="M648 745 L690 742" stroke="#c9c4bd" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M492 606 L570 606 L535 638 Z" fill="#2a2a2e" filter="url(#paper)"/>
    <rect x="808" y="605" width="68" height="32" fill="#f2643a" filter="url(#paper)"/>
  </g>

  <!-- chalk stars (filled by script) -->
  <g id="stars" filter="url(#crayon)"></g>
</svg>
</div>

<div class="bar">
  <button id="wowBtn" type="button">Make it jump</button>
  <button id="pauseBtn" type="button" class="ghost" aria-pressed="false">Pause</button>
</div>
<p class="hint">Tap the drawing for a surprise. Every crayon line wobbles like a hand-drawn cartoon.</p>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  // Sun rays
  const rays = document.getElementById("sunRays");
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    rays.appendChild(el("line", { x1: 872 + Math.cos(a) * 66, y1: 80 + Math.sin(a) * 66, x2: 872 + Math.cos(a) * 100, y2: 80 + Math.sin(a) * 100 }));
  }

  // Loopy crayon clouds (trochoid curves, like a kid's scribble)
  const clouds = document.getElementById("clouds");
  const cloudSpecs = [[530, 60, 52, 34, 7, 8], [700, 85, 62, 34, 8, 10], [770, 170, 70, 40, 9, 12], [870, 265, 58, 40, 7, 9], [900, 445, 55, 46, 7, 11]];
  cloudSpecs.forEach(([cx, cy, rx, ry, loops, dur], i) => {
    let d = "";
    for (let s = 0; s <= 400; s++) {
      const t = (s / 400) * Math.PI * 2;
      const x = cx + rx * Math.cos(t) + 16 * Math.cos(loops * t);
      const y = cy + ry * Math.sin(t) + 16 * Math.sin(loops * t);
      d += (s ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    const g = el("g", { class: "cloud", style: `--d:${dur}s` });
    g.appendChild(el("path", { d, fill: "none", stroke: "#5b2414", "stroke-width": 5, "stroke-linejoin": "round" }));
    clouds.appendChild(g);
  });

  // Zigzag "stitch" strips: staggered paper blocks, orange on top, black below
  function zip(id, y0, y1, xs) {
    const g = document.getElementById(id);
    const h = 48; let i = 0;
    for (let y = y0; y < y1; y += h - 6, i++) {
      const x = xs[i % xs.length];
      g.appendChild(el("rect", { x, y, width: 90 + (i % 2) * 10, height: h, class: "tb", style: `--delay:${(i * 0.12).toFixed(2)}s`, filter: "url(#paper)" }));
    }
  }
  zip("zipTop", 330, 600, [250, 262, 245, 255]);
  zip("zipBottom", 607, 875, [238, 252, 242, 258, 248]);
  document.getElementById("zipTop").appendChild(el("path", { d: "M300 300 Q350 290 345 312 Q300 315 285 340 L255 340 Q265 310 300 300 Z", filter: "url(#paper)" }));
  document.getElementById("zipBottom").appendChild(el("path", { d: "M255 868 L345 868 Q320 900 355 910 Q290 915 262 890 Z", filter: "url(#paper)" }));

  // Hand-drawn chalk stars (one-stroke pentagram, slightly lopsided)
  const stars = document.getElementById("stars");
  const starSpots = [[905, 770, 46], [880, 910, 42], [775, 1060, 46], [660, 1175, 44], [540, 1180, 40], [420, 1185, 42], [300, 1182, 40], [880, 1140, 34]];
  starSpots.forEach(([cx, cy, r], i) => {
    const pts = [];
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI / 2 + (k * 4 * Math.PI) / 5;
      const wob = 1 + ((k * 37 + i * 13) % 7 - 3) / 25;
      pts.push((cx + Math.cos(a) * r * wob).toFixed(1) + " " + (cy + Math.sin(a) * r * wob).toFixed(1));
    }
    stars.appendChild(el("path", {
      d: "M" + pts.join(" L"), fill: "none", stroke: "#e9e7e2", "stroke-opacity": 0.85,
      "stroke-width": 5, "stroke-linejoin": "round", "stroke-linecap": "round",
      class: "star tb", style: `--d:${(2 + (i % 3) * 0.6).toFixed(1)}s;--delay:${(i * 0.3).toFixed(1)}s`
    }));
  });

  // Controls
  const stage = document.getElementById("stage");
  function wow() {
    stage.classList.remove("wow"); void stage.offsetWidth; stage.classList.add("wow");
    setTimeout(() => stage.classList.remove("wow"), 1250);
  }
  stage.addEventListener("click", wow);
  document.getElementById("wowBtn").addEventListener("click", wow);
  const pauseBtn = document.getElementById("pauseBtn");
  pauseBtn.addEventListener("click", () => {
    const p = stage.classList.toggle("paused");
    const svg = stage.querySelector("svg");
    p ? svg.pauseAnimations() : svg.unpauseAnimations();
    pauseBtn.textContent = p ? "Play" : "Pause";
    pauseBtn.setAttribute("aria-pressed", String(p));
  });
</script>
</body>
</html>
